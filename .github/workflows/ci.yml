name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Uncomment to enable CI on direct push to main (after branch protection is solid)
# on:
#   push:
#     branches: [main]

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  lint:
    name: Lint (ajtf)
    runs-on: ubuntu-latest
    outputs:
      terraform-version: ${{ steps.lint.outputs.terraform-version }}
    steps:
      - uses: actions/checkout@v4
      - id: lint
        uses: ajay-infra/aj-tf-cli/lint@v0.3.0

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

